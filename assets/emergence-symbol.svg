<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">SEToE Emergence Symbol</title>
  <desc id="desc">A three-peak angular emergence glyph inside a luminous circular frame, inspired by the author's hand-drawn mark.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#14243a"/>
      <stop offset="1" stop-color="#050912"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1bd"/>
      <stop offset=".48" stop-color="#f6bd55"/>
      <stop offset="1" stop-color="#fff0a8"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <circle cx="600" cy="520" r="390" fill="none" stroke="#b98743" stroke-opacity=".42" stroke-width="2"/>
  <circle cx="600" cy="520" r="365" fill="none" stroke="url(#gold)" stroke-opacity=".8" stroke-width="4"/>
  <circle cx="600" cy="520" r="320" fill="none" stroke="#d5a65b" stroke-opacity=".18" stroke-width="1.5"/>
  <path d="M600 105V935 M185 520H1015" stroke="#d7ad6d" stroke-opacity=".22" stroke-width="1.5"/>
  <circle cx="600" cy="520" r="8" fill="#fff0b4" filter="url(#glow)"/>
  <path d="M315 665 L345 310 L475 500 L600 345 L730 515 L855 330 L890 705"
        fill="none" stroke="url(#gold)" stroke-width="19" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M600 130V910 M210 520H990" stroke="#f3c879" stroke-opacity=".35" stroke-width="1"/>
  <circle cx="600" cy="155" r="5" fill="#f6d28c"/>
  <circle cx="600" cy="885" r="5" fill="#f6d28c"/>
  <circle cx="235" cy="520" r="5" fill="#f6d28c"/>
  <circle cx="965" cy="520" r="5" fill="#f6d28c"/>
  <text x="600" y="1010" text-anchor="middle" fill="#f4d79e" font-family="Georgia,serif" font-size="48" letter-spacing="12">EMERGENCE</text>
  <text x="600" y="1065" text-anchor="middle" fill="#d2b27a" font-family="Arial,sans-serif" font-size="17" letter-spacing="5">THE PRINCIPLE OF BECOMING</text>
</svg>
